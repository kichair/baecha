<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f5f37"><title>광일체어 배차</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;background:#f5f6f8;color:#16202c;font-size:14px;padding-bottom:66px}
button,select,input{font-family:inherit}
.top{background:linear-gradient(135deg,#03C75A,#02B350);color:#fff;padding:10px 13px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:800;letter-spacing:-.3px}
.top .sp{flex:1}
.top select{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:7px;padding:5px 8px;font-size:12.5px;font-weight:700}
.top select option{color:#16202c}
.btn{background:#2F7FE8;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn.g{background:rgba(255,255,255,.17)}
.btn.s{background:#eef2f7;color:#5f7086}
.btn:active{transform:scale(.96)}
.wrap{padding:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde4ec;display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:0;border:0;padding:9px 4px 8px;font-size:10.5px;color:#8b9aab;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.tabs button em{font-size:19px;font-style:normal;line-height:1}
.tabs button.on{color:#2F7FE8}
.bdg{position:absolute;top:4px;left:52%;background:#e04b45;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:9px}
.hero{background:#fff;border-radius:16px;padding:15px;display:flex;align-items:center;gap:15px;box-shadow:0 2px 10px rgba(22,50,79,.07);margin-bottom:10px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .txt b{font-size:22px;font-weight:800;line-height:1;color:#0f5f37}
.ring .txt span{font-size:10px;color:#8b9aab;margin-top:2px;font-weight:700}
.hero .info{flex:1;min-width:0}
.hero .info h2{font-size:17px;font-weight:800;margin-bottom:3px;letter-spacing:-.4px}
.hero .info p{font-size:12px;color:#6b7c90;line-height:1.55}
.namesline{background:#fff;border:1px solid #ebeef1;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:12px;font-weight:700;color:#3c4a5a;line-height:1.9}
.namesline b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#03C75A;color:#fff;font-size:9.5px;margin-right:3px;vertical-align:-2px}
.namesline .sep{color:#c3ceda;margin:0 6px}
.cheer{margin-top:7px;font-size:12.5px;font-weight:800;color:#03C75A;background:#e6f8ef;padding:5px 10px;border-radius:9px;display:inline-block}
.sw{position:relative;border-radius:13px;overflow:hidden;margin-bottom:9px;touch-action:pan-y}
.sw .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e0a03a 50%,#03C75A 50%)}
.c{position:relative;background:#fff;border-radius:12px;padding:12px 13px;border:1px solid #ebeef1;cursor:grab;user-select:none;transition:border-color .15s}
.c.hot{border-left:3px solid #f0654f}.c.urg{border-left:3px solid #f0a93a}
.c.ok{border-left:3px solid #03C75A;background:#f5fbf7;opacity:.7}
.c.exc{background:#f8fafb;opacity:.8}
.c.drag{opacity:.4}
.c.cm{padding:10px 12px}
.cmrow{display:flex;align-items:center;gap:8px;cursor:pointer}
.cmrow .nm{flex:1;font-size:14px;font-weight:800;letter-spacing:-.3px}
.cmrow .nm small{font-weight:600;color:#9aa8b8;font-size:11px}
.mvv{display:flex;flex-direction:column;gap:4px;flex:none}
.mvv b{width:36px;height:27px;border-radius:7px;background:#eef2f7;color:#4d5c6e;font-size:14px;display:grid;place-items:center;cursor:pointer;line-height:1}
.mvv b:active{background:#03C75A;color:#fff}
.cmrow .pct{font-size:12px;font-weight:800;color:#2F7FE8;font-variant-numeric:tabular-nums}
.cmrow .cchk{width:22px;height:22px;border-radius:6px;background:#eef2f7;color:#8b9aab;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.cmrow .cchk.ok{background:#03C75A;color:#fff}
.cmsub{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.cmsub .dest{font-size:11px;color:#8b9aab;font-weight:600}
.subcar{background:#0f5f37;color:#fff;font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:9px;margin:4px 0 2px}
.colbar{text-align:center;font-size:11px;font-weight:800;color:#8b9aab;padding:5px;cursor:pointer;background:#f5f8fb;border-radius:8px;margin-bottom:6px}
.c .hd{display:flex;gap:8px;align-items:flex-start}
.c .nm{font-size:15px;font-weight:800;line-height:1.3;flex:1;letter-spacing:-.3px}
.c .pct{font-size:12px;font-weight:800;color:#2F7FE8;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:10.5px;font-weight:700;background:#f2f4f6;color:#6b7684;padding:2px 8px;border-radius:20px}
.chip.q{background:#eaf1fd;color:#2F7FE8}
.chip.x{background:#fdecea;color:#d0503f}
.chip.l{background:#e7f7ee;color:#03874a}
.chip.c{background:#f1e6f9;color:#7b3fa0}
.chip.d{background:#fff3dc;color:#8a5a00}
.addr{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:12.5px;line-height:1.5;color:#3c4a5a;background:#f5f8fb;padding:8px 10px;border-radius:9px}
.addr.dv{background:#eaf7ef;color:#03C75A}
.addr.no{background:#fdf3f2;color:#9d7069}
.addr .tx{flex:1;min-width:0}
.addr .go{flex:none;display:flex;gap:5px}
.addr .go a{background:#fff;border:1px solid #dde5ee;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-size:15px;text-decoration:none}
.memo{margin-top:7px;font-size:12px;color:#c0392b;font-weight:700;line-height:1.5}
.items{list-style:none;margin-top:8px;border-top:1px dashed #e4eaf1;padding-top:7px}
.items li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:#54637a;line-height:1.65}
.items li b{color:#16202c;font-variant-numeric:tabular-nums;font-weight:800}
.items li i{color:#9aa8b8;font-style:normal;font-size:11.5px}
.cdrv{display:flex;align-items:center;gap:7px;margin-top:8px;background:#f5f8fb;border-radius:9px;padding:6px 10px}
.cdrv span{font-size:11px;font-weight:800;color:#8b9aab}
.cdrv select{flex:1;padding:6px 8px;border:1px solid #dde5ee;border-radius:7px;font-size:12.5px;font-weight:700;background:#fff}
.acts{display:flex;gap:5px;margin-top:9px}
.acts button{flex:1;border:0;border-radius:9px;padding:9px;font-size:12.5px;font-weight:800;cursor:pointer;background:#eef2f7;color:#5f7086}
.acts button.done{background:#03C75A;color:#fff}
.acts button.hold{background:#f5ead6;color:#8a5a00}
.acts button.undo{background:#e7f0fb;color:#2F7FE8}
.sec{background:#fff;border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid #ebeef1}
.sec>h3{padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid #f2f4f6}
.sec>h3 .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none;letter-spacing:-.5px}
.sec>h3 .t{flex:1;min-width:0}
.sec>h3 .t b{font-size:14px;font-weight:800;display:block;letter-spacing:-.3px}
.sec>h3 .t span{font-size:11px;color:#8b9aab;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec>h3 .rt{text-align:right;flex:none}
.sec>h3 .rt b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.sec>h3 .rt span{font-size:10.5px;color:#8b9aab}
.sec .dv{display:flex;gap:6px;padding:0 12px 9px;align-items:center}
.sec .dv select{flex:1;padding:8px;border:1.5px solid #dde5ee;border-radius:9px;font-size:13px;font-weight:700;background:#fff}
.sec .dv select.none{border-color:#f0b6b2;background:#fdf6f5;color:#a5372f}
.sec .dv select.n{flex:0 0 76px}
.load{height:6px;background:#eef1f4;margin:10px 13px 9px;border-radius:4px;overflow:hidden}
.load i{display:block;height:100%;background:#03C75A;border-radius:4px;transition:.3s}
.load.w i{background:#e0a03a}.load.o i{background:#e04b45}
.body{padding:0 9px 9px;min-height:8px;counter-reset:bseq}
.body>.sw,.body>.cardw .sw{counter-increment:bseq}
.body>.sw>.c,.body>.cardw .sw>.c{padding-left:36px}
.body>.sw>.c::before,.body>.cardw .sw>.c::before{content:counter(bseq);position:absolute;left:9px;top:11px;width:20px;height:20px;border-radius:50%;background:#03C75A;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.lifo{margin:0 12px 10px;padding:7px 10px;background:#f2f7f4;border-radius:8px;font-size:11px;font-weight:700;color:#3c6b52;line-height:1.5}
.body.over{background:#eaf3ff;outline:2px dashed #7fb0ee;outline-offset:-4px;border-radius:10px}
.empty{padding:16px;text-align:center;color:#a4b1c0;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.dcard{background:#fff;border-radius:14px;padding:13px;text-align:left;border:2px solid transparent;cursor:pointer;box-shadow:0 1px 6px rgba(22,50,79,.07)}
.dcard.on{border-color:#2F7FE8;background:#f7fbff}
.dcard b{font-size:15px;font-weight:800;display:block;letter-spacing:-.3px}
.dcard span{font-size:11px;color:#8b9aab;display:block;margin-top:2px}
.dcard .mini{margin-top:9px;height:6px;background:#eef2f7;border-radius:4px;overflow:hidden}
.dcard .mini i{display:block;height:100%;background:#03C75A}
.dcard .st{margin-top:6px;font-size:11.5px;font-weight:800;color:#5f7086}
.rank{background:#fff;border-radius:14px;padding:4px;box-shadow:0 1px 6px rgba(22,50,79,.07)}
.rk{display:flex;align-items:center;gap:10px;padding:10px 11px;border-bottom:1px solid #f0f4f8}
.rk:last-child{border:0}
.rk .no{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#eef2f7;color:#5f7086;flex:none}
.rk .no.g1{background:#ffe9a8;color:#8a6100}.rk .no.g2{background:#e6ecf2}.rk .no.g3{background:#f5ddc9;color:#8a5a2f}
.rk .nm{flex:1;font-weight:800;font-size:13.5px;min-width:0}
.rk .nm span.durb{display:inline-block;width:auto;background:#e6f8ef;color:#03874a;font-size:12px;font-weight:800;padding:1px 9px;border-radius:12px;margin:1px 0 1px 4px;white-space:nowrap}
.rk .nm span{display:block;font-size:11px;color:#8b9aab;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar3{width:70px;height:6px;background:#eef2f7;border-radius:4px;overflow:hidden;flex:none}
.rk .bar3 i{display:block;height:100%;background:#03C75A}
.rk .v{font-size:12px;font-weight:800;width:54px;text-align:right;font-variant-numeric:tabular-nums}
.wxbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.wxload{grid-column:1/-1;background:#fff;border-radius:12px;padding:12px;text-align:center;color:#8b9aab;font-size:12px;font-weight:700;box-shadow:0 1px 5px rgba(22,50,79,.06)}
.wx{background:#fff;border-radius:12px;padding:9px 10px;box-shadow:0 1px 5px rgba(22,50,79,.06);display:flex;flex-direction:column;align-items:center;gap:1px;border-top:3px solid #7dd1a0}
.wx.r2{border-top-color:#e0a03a}.wx.r3{border-top-color:#e04b45}
.wx .wt{font-size:22px;line-height:1}
.wx .wn{font-size:11px;font-weight:800;color:#5f7086}
.wx .wd b{font-size:15px;font-weight:800;color:#16202c}
.wx .wd span{font-size:11px;color:#9aa8b8}
.wx .wr{font-size:11px;font-weight:800;color:#5f7086}
.wx.r2 .wr{color:#c98a1a}.wx.r3 .wr{color:#e04b45}
@media(max-width:520px){.wxbar{grid-template-columns:repeat(2,1fr)}}
.gmap{height:320px;border-radius:14px;overflow:hidden;margin-bottom:10px;border:1px solid #ebeef1;background:#f2f4f6}
.dgrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px;align-items:stretch}
.dghead{flex:0 0 128px;background:#0f5f37;color:#fff;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.dghead b{font-size:15.5px}
.dghead span{font-size:11.5px;opacity:.92;font-weight:700}
.dgcell{flex:1;min-width:200px;background:#fff;border:1px solid #ebeef1;border-radius:12px;padding:11px 13px;cursor:pointer;box-shadow:0 1px 5px rgba(22,50,79,.06)}
.dgcell .dgt{display:flex;gap:8px;align-items:center}
.dgcell .dgt b{font-size:14.5px}
.dgcell .dgz{font-size:11px;color:#8b9aab;font-weight:700;margin-top:2px}
.dgcell .dgv{font-size:12px;color:#33475c;font-weight:700}
.dlist{display:flex;flex-direction:column;gap:8px}
.dvrow{width:auto;cursor:pointer}
.drowtop{display:flex;gap:10px;align-items:baseline}
.drowtop b{font-size:15.5px}
.drowtop span{color:#8b9aab;font-size:12px}
.ttime{font-size:13px;font-weight:800;color:#0f5f37;margin-top:6px}
.ttime .tsub{font-weight:700;color:#5f7086;font-size:12px;margin-left:6px}
.trlb{background:#0f5f37;color:#fff;border-radius:6px;padding:2px 8px;margin-right:7px;font-size:11px;white-space:nowrap}
.trdet{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px 10px;padding:8px 4px 2px;border-top:1px dashed #e3e9ef;margin-top:7px}
.trdet span{font-size:12px;font-weight:700;color:#33475c;background:#f4f7fa;border-radius:8px;padding:4px 8px}
.trdet span b{color:#0f5f37;margin-right:3px}
.trdet span i{font-style:normal;color:#8b9aab;font-weight:600}
.bigsw{margin-top:10px;padding:12px 20px;border:2px solid #0f5f37;background:#fff;border-radius:12px;font-weight:800;font-size:15px;color:#0f5f37;cursor:pointer}
.bigsw:active{background:#eaf7ef}
.srchbar{position:relative;background:#fff;border:1.5px solid #dde5ee;border-radius:12px;padding:11px 14px;display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:15px}
.kpisrch{grid-column:span 2;margin-bottom:0;font-size:17px;border-width:2px;border-color:#bcd8c6}
.kpisrch input{font-size:16px;font-weight:700}
.srchbar input{border:none;outline:none;flex:1;font-size:15px;background:transparent}
#srchres{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #dde5ee;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.14);z-index:60;max-height:340px;overflow:auto}
.sri{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f1f4f7;align-items:center}
.sri:hover{background:#f4f9f6}
.sri b{font-size:13.5px}.sri span{color:#5f7086;font-size:12px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:12px;padding:10px;box-shadow:0 1px 5px rgba(22,50,79,.06)}
.kpi span{font-size:10.5px;color:#8b9aab;font-weight:800;display:block}
.kpi b{font-size:18px;font-weight:800;color:#0f5f37;display:block;margin-top:2px;letter-spacing:-.5px}
.kpi.al b{color:#e04b45}
.hd2{font-size:12px;font-weight:800;color:#6b7c90;margin:15px 2px 7px;display:flex;align-items:center;gap:6px}
.hd2 .n{background:#dde5ee;color:#5f7086;padding:1px 7px;border-radius:9px;font-size:11px}
dialog{border:0;border-radius:16px;padding:0;width:94vw;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.34)}
dialog::backdrop{background:rgba(10,20,35,.55)}
.dh{padding:13px 15px;background:#0f5f37;color:#fff;display:flex;align-items:center;gap:9px}
.dh h3{font-size:14.5px;flex:1;font-weight:800}
.db{padding:13px 15px;max-height:72vh;overflow:auto}
.db table{width:100%;border-collapse:collapse;font-size:12.5px}
.db th,.db td{padding:6px 8px;border-bottom:1px solid #eef2f7;text-align:left}
.db th{background:#f6f9fc;font-size:11px;color:#6b7c90;position:sticky;top:0}
.db input[type=number]{width:72px;padding:5px;border:1px solid #dde5ee;border-radius:6px;text-align:right}
.pk{display:flex;flex-direction:column;gap:5px}
.pk .g{font-size:11px;color:#8b9aab;font-weight:800;margin:9px 0 1px}
.pk .i{display:flex;gap:9px;align-items:center;padding:10px 11px;border:1px solid #e6ecf2;border-radius:10px;cursor:pointer;background:#fbfcfe}
.pk .i:active{background:#eaf3ff}
.pk .i .nm{flex:1;font-weight:800;font-size:13px}
.pk .i .sub{font-size:11px;color:#8b9aab;font-weight:500;margin-top:1px}
.pk .i .q{font-size:11.5px;font-weight:800;color:#2F7FE8}
#q{width:100%;padding:10px 12px;border:1.5px solid #dde5ee;border-radius:10px;font-size:14px;margin-bottom:8px}
.frm{display:grid;grid-template-columns:80px 1fr;gap:8px 10px;align-items:center;font-size:12.5px}
.frm input,.frm select{padding:8px 9px;border:1px solid #dde5ee;border-radius:8px;font-size:13px;width:100%}
.irow,.drow{display:grid;gap:6px;margin-bottom:6px}
.irow{grid-template-columns:1fr 92px 64px 32px}
.drow{grid-template-columns:1fr 132px 32px}
.irow input,.drow input{padding:8px;border:1px solid #dde5ee;border-radius:8px;font-size:13px}
.tip{background:#f2f7fc;border-left:3px solid #2F7FE8;padding:9px 12px;font-size:12px;color:#44566c;line-height:1.7;margin-bottom:12px;border-radius:0 8px 8px 0}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(96px);background:#0f5f37;color:#fff;padding:11px 16px;border-radius:26px;font-size:13px;font-weight:700;z-index:99;transition:.26s;display:flex;gap:11px;align-items:center;box-shadow:0 8px 26px rgba(0,0,0,.3);max-width:92vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast button{background:#2F7FE8;color:#fff;border:0;padding:5px 11px;border-radius:8px;font-weight:800;font-size:12px}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
.cf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.25s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(86vh) rotate(680deg)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}55%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .32s}
.allok{background:#03C75A;color:#fff;border-radius:16px;padding:26px 18px;text-align:center;margin-bottom:10px}
.allok .em{font-size:44px;line-height:1}
.allok b{font-size:19px;font-weight:800;display:block;margin-top:9px}
.allok span{font-size:13px;opacity:.92;display:block;margin-top:4px}
.setup{background:#fff;border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 2px 12px rgba(22,50,79,.08)}
.setup .em{font-size:40px}
.setup h2{font-size:17px;font-weight:800;margin:10px 0 6px}
.setup p{font-size:13px;color:#6b7c90;line-height:1.7;margin-bottom:14px}

function capOf(n){
 // 사이즈 명시 시: 바닥면적(1톤 장축 1600×3500=5.6㎡) × 단수(적재높이 2100 기준)
 const sz=n.match(/(\d{3,4})\s*[*xX×]\s*(\d{3,4})(?:\s*[*xX×]\s*(\d{3,4}))?/);
 if(sz){const W=+sz[1],D=+sz[2],H=sz[3]?+sz[3]:0;
  if(W>=300&&D>=200){
   // 격자 배열: 가로·세로 실제로 몇 개 들어가는지 (두 방향 중 큰 쪽)
   const per=Math.max(1,Math.floor(1600/W)*Math.floor(3500/D),Math.floor(1600/D)*Math.floor(3500/W));
   let ly;
   if(H>=200)ly=Math.max(1,Math.min(3,Math.floor(2100/H)));      // 높이로 단수 결정
   else if(/상판|도어만/.test(n))ly=6;                             // 판재는 눕혀 다량
   else if(/테이블|서랍/.test(n))ly=3;
   else if(/장|옷장|서가|락카/.test(n))ly=2;                        // 높이 미상 장류: 2단 가정
   else ly=1;
   const cap=Math.min(per*ly,300);
   return{c:cap,l:'사이즈 '+W+'×'+D+(H?'×'+H:'')+' · '+ly+'단'}}}
 const sw=n.match(/W(\d{3,4})/);
 if(sw){const W=+sw[1];const per=Math.max(1,Math.floor(1600/W)*Math.floor(3500/600),Math.floor(1600/600)*Math.floor(3500/W));return{c:per,l:'사이즈 W'+sw[1]+' · 1단'}}
 for(const c of CAP_DEF)for(const k of c.k)if(n.indexOf(k)>=0)return{c:CAPS[c.id]||60,l:c.l};
 return{c:CAPS.etc||60,l:'기타'}}
const loadOf=o=>o.items.reduce((s,it)=>s+it.q/(capOf(it.p).c||60),0);

const ADRE=/(?:[가-힣]+(?:특별시|광역시|자치시|자치도|도)\s*)?[가-힣]{2,}(?:시|군|구)\s+[^,/]{2,44}/;
function resolveCust(t){
 if(!t)return null;t=t.replace(/\s/g,'');
 if(ALIAS_DB[t]&&ADDR[ALIAS_DB[t]])return ALIAS_DB[t];
 if(ADDR[t])return t;
 for(const k in ALIAS_DB)if(k.replace(/\s/g,'')===t&&ADDR[ALIAS_DB[k]])return ALIAS_DB[k];
 if(t.length>=3)for(const k in ADDR){if(k.replace(/[\s()（）:;·.\-]/g,'').indexOf(t)>=0)return k}
 return null}
function destOf(o){
 const m=o.memo||'';
 const a=m.match(ADRE);if(a)return{t:a[0].trim(),src:'적요'};
 const b=m.match(/([가-힣A-Za-z0-9]{2,12})\s*(?:으로|로)\s*(?:배송|배달)/);
 if(b){const c=resolveCust(b[1]);if(c)return{t:ADDR[c]+' ◂'+c.replace(/\(.*$/,'').slice(0,8),src:'적요'}}
 const d=m.match(/([가-힣A-Za-z0-9()]{2,})\s*(?:으로|로)?\s*(?:직납|직배|직접배송)/);
 if(d){const c=resolveCust(d[1].replace(/[()]/g,''));if(c)return{t:ADDR[c]+' ◂'+c.replace(/\(.*$/,'').slice(0,8)+' 직납',src:'적요'};return{t:d[1]+' 직납',src:'적요'}}
 const d2=m.match(/([가-힣]{2,})\s*(?:매장|창고|지점)/);
 if(d2){const c=resolveCust(d2[1]);if(c)return{t:ADDR[c]+' ◂'+c.replace(/\(.*$/,'').slice(0,8),src:'적요'};return{t:d2[0].trim()+'으로',src:'적요'}}
 if(ADDR[o.n])return{t:ADDR[o.n],src:'거래처'};
 return null}
function hitRoute(t){if(!t)return null;
 for(const r of ROUTES)for(const k of r.k)if(t.indexOf(k)>=0)return r.id;return null}
function guess(o){
 if(o.ex)return 'x';
 // 1) 실제 과거 배차가 있는 날짜는 그대로 재현
 if(DAY_CUST[o.d]&&DAY_CUST[o.d][o.n])return DAY_CUST[o.d][o.n];
 // 2) 적요에 목적지 주소/직납이 있으면 거래처 상습동선보다 우선 (그날 실제 배송지)
 const D=destOf(o);
 if(D&&D.src==='적요'){const r=hitRoute(D.t);if(r)return r}
 // 3) 손으로 옮긴 기억 / 상습 동선 / 거래처 주소 / 상호
 if(LEARN[o.n])return LEARN[o.n];
 if(LEARN_RT[o.n])return LEARN_RT[o.n];
 return hitRoute(ADDR[o.n]||'')||hitRoute(o.n+' '+(o.memo||''))||'_'}
function why(o){
 const D=destOf(o);if(D&&D.src==='적요'&&hitRoute(D.t))return '적요';
 if(LEARN[o.n])return '매장';
 if(LEARN_RT[o.n])return '실적';
 if(GRP[o.n])return '거래처';
 if(hitRoute(ADDR[o.n]||''))return '주소';
 if(hitRoute(o.n+' '+(o.memo||'')))return '상호';

const dkey=(n,ex,d)=>n+'§'+ex+'§'+d;
/* 기사-동선 매일 순환 배정 (배진성=3.5톤 고정 · 김석호/직납 제외) */
function autoRotate(dateStr){
 const pool=DRVS.map(d=>d[0]).filter(n=>['배진성','김석호','용차'].indexOf(n)<0);
 const o={t35:'배진성'};
 if(!pool.length||!dateStr)return o;
 const day=Math.floor(new Date(dateStr+'T00:00:00').getTime()/86400000);
 const off=((day%pool.length)+pool.length)%pool.length;
 const dow=new Date(dateStr+'T00:00:00').getDay();
 const rts=['r1','r2','r3','r4','r5','r6','r7'];
 if(dow===3)rts.push('rw');if(dow===2||dow===4)rts.push('rc');
 rts.forEach((r,k)=>{o[r]=pool[(k+off)%pool.length]});
 return o}
function build(fresh){
 ORDERS=[];const g={};
 RAW.forEach(l=>{const ex=exLine(l.m,l.n)||'';const k=dkey(l.n,ex,l.d);
  if(!g[k])g[k]={n:l.n,ex:ex||null,od:l.d,items:[]};
  g[k].items.push(l)});
 Object.keys(g).forEach(k=>{const c=g[k];
  const ms=[];c.items.forEach(x=>{if(x.m&&ms.indexOf(x.m)<0)ms.push(x.m)});
  ORDERS.push({n:c.n,ex:c.ex,od:c.od,key:k,d:DOVR[k]||c.od,items:c.items,memo:ms.join(' / ')})});
 CUSTOM.forEach((c,j)=>{const k='cu'+j;
  ORDERS.push({n:c.n,ex:null,od:c.d||SEL,key:k,d:DOVR[k]||c.d||SEL,items:c.items,memo:c.memo||'',cu:1})});
 ORDERS.forEach((o,i)=>{o.i=i;o.qty=o.items.reduce((a,b)=>a+b.q,0);o.load=loadOf(o);
  o.urg=/일찍|오전|새벽|아침/.test(o.memo||'')?0:1;
  o.sk=o.urg+'|'+((ADDR[o.n]||'힣힣').slice(0,14))});
 DATES=[];ORDERS.forEach(o=>{if(o.d&&DATES.indexOf(o.d)<0)DATES.push(o.d)});DATES.sort();
 if(!SEL||DATES.indexOf(SEL)<0)SEL=DATES[DATES.length-1]||'';
 if(!CARD[SEL])CARD[SEL]=Object.assign({},DAY_DRV[SEL]||autoRotate(SEL));
 CAR=CARD[SEL];
 const cc={};ORDERS.forEach(o=>{if(o.d===SEL)cc[o.n]=(cc[o.n]||0)+1});
 ORDERS.forEach(o=>o.split=cc[o.n]>1);
 if(fresh||!ASSIGN){ASSIGN={};ST={};ORDERS.forEach(o=>ASSIGN[o.i]=guess(o))}
 else ORDERS.forEach(o=>{if(ASSIGN[o.i]===undefined)ASSIGN[o.i]=guess(o)});

 ORDERS.forEach(o=>{if(o.d>'2026-07-29'&&!o.ex&&DRVOV[o.key]==null&&o.items.length&&o.items.every(it=>it.s==='[삼정가구]'))DRVOV[o.key]='장세훈'})}

function ccard(o){
 const st=ST[o.i],done=st==='done',hold=st==='hold',ex=ASSIGN[o.i]==='x';
 let cls='';if(done)cls='ok';else if(ex)cls='exc';else if(hold)cls='urg';
 else if(o.load>0.9)cls='hot';else if(/일찍|최대한|까지|직납|직배|새벽|조달/.test(o.memo||''))cls='urg';
 const w=why(o);const D=destOf(o);

function driverTrips(list){

 list.forEach(o=>{const rid=ASSIGN[o.i];(grp[rid]=grp[rid]||[]).push(o)});
 const rows=[];
 Object.keys(grp).forEach(rid=>{
  const g=grp[rid].slice().sort(bySeq);
  const cf=capFactor(rid)||1;
  const tot=g.reduce((a,o)=>a+o.load,0);
  if(tot<=1.05*cf){rows.push({rid:rid,list:g,L:tot,cont:[]});return}
  let cur={list:[],L:0,cont:[]};
  const flush=()=>{if(cur.list.length||cur.cont.length)rows.push({rid:rid,list:cur.list,L:cur.L,cont:cur.cont});cur={list:[],L:0,cont:[]}};
  g.forEach(o=>{
   if(cur.L+o.load<=1.05*cf){cur.list.push(o);cur.L+=o.load;return}
   let rem=o.load,first=true,guard=0;
   while(rem>0.001&&guard++<20){
    const space=cf-cur.L;
    if(space<0.1){flush();continue}
    const take=Math.min(space,rem);
    cur.list.push(o);if(!first)cur.cont.push(o.n);first=false;
    cur.L+=take;rem-=take;
    if(rem>0.001)flush();
   }
  });
  flush();
 });
 const ord=ROUTES.map(x=>x.id);
 rows.forEach(r=>r.ri=ord.indexOf(r.rid));
 rows.sort((a,b)=>a.ri-b.ri);

 document.getElementById('pkT').textContent=RID[id].nm+' 로 가져오기';
 document.getElementById('q').value='';drawPick();
 document.getElementById('pick').showModal();document.getElementById('q').focus()}
function openMove(i){pkM='push';pkA=i;
 document.getElementById('pkT').textContent=ORDERS[i].n+' — 어디로?';
 document.getElementById('q').value='';drawPick();document.getElementById('pick').showModal()}
function drawPick(){
 const q=document.getElementById('q'),pkB=document.getElementById('pkB');
 if(pkM==='pull'){q.style.display='';const kw=(q.value||'').trim();
  const list=ORDERS.filter(o=>o.d===SEL&&ST[o.i]!=='del'&&ASSIGN[o.i]!==pkA&&
   (!kw||o.n.indexOf(kw)>=0||o.items.some(x=>x.p.indexOf(kw)>=0)));
  const g={},ks=[];
  list.forEach(function(o){const L=locNm(ASSIGN[o.i]);if(!g[L]){g[L]=[];ks.push(L)}g[L].push(o)});
  pkB.innerHTML=ks.map(function(L){return '<div class="g">'+L+'</div>'+g[L].map(function(o){
   return '<div class="i" onclick="pick.close();move('+o.i+',\''+pkA+'\',\'가져왔습니다\',1)">'
   +'<div style="flex:1;min-width:0"><div class="nm">'+o.n+'</div>'
   +'<div class="sub">'+(ADDR[o.n]||o.items.map(x=>x.p).join(', ')).slice(0,46)+'</div></div>'
   +'<div class="q">'+o.qty+'개</div></div>'}).join('')}).join('')||'<div class="empty">결과 없음</div>'}
 else{q.style.display='none';const cur=ASSIGN[pkA];
  const opts=[['_','배차 필요']].concat(ROUTES.map(r=>[r.id,r.nm+' — '+r.zone])).concat([['x','제외 (택배·화물)']]);
  pkB.innerHTML=opts.filter(o=>o[0]!==cur).map(function(o){
   return '<div class="i" onclick="pick.close();move('+pkA+',\''+o[0]+'\',\'옮겼습니다\',1)"><div class="nm">'+o[1]+'</div></div>'}).join('')}}
function setAddr(i){const n=ORDERS[i].n;
 const v=prompt(n+'\n주소를 입력하세요 (지역명만 있어도 됩니다)',ADDR[n]||'');
 if(v===null)return;
 if(v.trim())ADDR[n]=v.trim();else delete ADDR[n];
 if(!LEARN[n]){const r=guess(ORDERS[i]);if(r!=='_')ASSIGN[i]=r}
 save();render();toast('주소 저장 — 다음에도 적용됩니다')}
function setDate(i){const o=ORDERS[i];
 const v=prompt(o.n+'\n배송일 (YYYY-MM-DD). 비우면 원래 날짜('+o.od+')로 되돌립니다.',o.d);
 if(v===null)return;
 if(v.trim()&&v.trim()!==o.od)DOVR[o.key]=v.trim();else delete DOVR[o.key];
 save();render();toast('배송일 변경')}
function drow(n,p){const d=document.createElement('div');d.className='drow';
 d.innerHTML='<input placeholder="기사명" value="'+n+'"><input placeholder="연락처" value="'+p+'">'
 +'<button class="btn s" onclick="this.parentNode.remove();syncD()">✕</button>';
 d.querySelectorAll('input').forEach(function(i){i.oninput=syncD});
 document.getElementById('drows').appendChild(d);syncD()}
function syncD(){DRVS=[].slice.call(document.getElementById('drows').querySelectorAll('.drow')).map(function(r){
 const a=r.querySelectorAll('input');return[a[0].value.trim(),a[1].value.trim()]}).filter(x=>x[0]);save()}
function openDrv(){const dr=document.getElementById('drows');dr.innerHTML='';
 DRVS.forEach(function(d){drow(d[0],d[1])});document.getElementById('drv').showModal()}
function irow(){const d=document.createElement('div');d.className='irow';
 d.innerHTML='<input placeholder="의자명 (예: 흑로대)"><input placeholder="색상 (예: 검정)"><input type="number" placeholder="수량">'
 +'<button class="btn s" onclick="this.parentNode.remove()">✕</button>';
 document.getElementById('aI').appendChild(d)}
function aNsug(){
 const q=document.getElementById('aN').value.trim();
 const dl=document.getElementById('custlist');const ad=document.getElementById('aAddr');
 if(ADDR[q]!=null){ad.textContent='📍 '+ADDR[q];
  const g=guess({n:q,memo:'',ex:null});
  if(g&&g!=='_'&&g!=='x')document.getElementById('aT').value=g;}
 else ad.textContent='';
 if(q.length<2){dl.innerHTML='';return}
 let h='',c=0;
 for(const n in ADDR){if(n.includes(q)){h+='<option value="'+n.replace(/"/g,'&quot;')+'">';if(++c>=20)break}}
 dl.innerHTML=h}
function openAdd(){document.getElementById('aN').value='';document.getElementById('aM').value='';
 const _tm=new Date(Date.now()+86400000);
 document.getElementById('aD').value=_tm.getFullYear()+'-'+String(_tm.getMonth()+1).padStart(2,'0')+'-'+String(_tm.getDate()).padStart(2,'0');
 document.getElementById('aAddr').textContent='';document.getElementById('custlist').innerHTML='';
 document.getElementById('aI').innerHTML='';irow();
 document.getElementById('aT').innerHTML=[['_','배차 필요']].concat(ROUTES.map(r=>[r.id,r.nm])).concat([['x','제외']])
  .map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');
 document.getElementById('add').showModal();document.getElementById('aN').focus()}
function doAdd(){const n=document.getElementById('aN').value.trim();
 if(!n)return alert('거래처명을 입력하세요');
 const m=document.getElementById('aM').value.trim();
 const dd=document.getElementById('aD').value||SEL;
 const items=[].slice.call(document.getElementById('aI').querySelectorAll('.irow')).map(function(r){
  const a=r.querySelectorAll('input');
  return{n:n,p:a[0].value.trim(),s:a[1].value.trim(),q:+a[2].value||0,m:m,d:dd}}).filter(x=>x.p&&x.q>0);
 if(!items.length)return alert('품목과 수량을 입력하세요');
 CUSTOM.push({n:n,items:items,memo:m,d:dd});
 const t=document.getElementById('aT').value;
 document.getElementById('add').close();save();build();
 for(let i=0;i<ORDERS.length;i++)if(ORDERS[i].cu&&ORDERS[i].n===n&&ORDERS[i].d===dd)ASSIGN[ORDERS[i].i]=t==='_'?guess(ORDERS[i]):t;
 save();render();toast(dd.slice(5)+' 에 추가했습니다')}

/* ============ 파일 ============ */
function withXLSX(cb){if(window.XLSX)return cb();
 const s=document.createElement('script');s.src=CDN;s.onload=cb;
 s.onerror=function(){alert('엑셀 처리기를 불러오지 못했습니다(인터넷 필요).\n엑셀에서 CSV(UTF-8)로 저장 후 다시 시도해주세요.')};
 document.head.appendChild(s)}
function readSheets(f,cb){
 const ext=f.name.split('.').pop().toLowerCase();
 if(ext==='csv'){const rd=new FileReader();
  rd.onload=function(){cb([['csv',rd.result.replace(/\r/g,'').split('\n').filter(l=>l.trim())
   .map(l=>l.split(',').map(c=>c.replace(/^"|"$/g,'')))]])};
  return rd.readAsText(f,'utf-8')}
 withXLSX(function(){const rd=new FileReader();
  rd.onload=function(){const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
   cb(wb.SheetNames.map(n=>[n,XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})]))};
  rd.readAsArrayBuffer(f)})}
function hdrRow(rows){for(let i=0;i<Math.min(rows.length,15);i++){
 const has=rows[i].some(function(c){const t=String(c||'').replace(/\s/g,'');
  return t.indexOf('거래처명')>=0||t==='상호'});
 if(has)return i}return -1}
function onCust(f){if(!f)return;
 readSheets(f,function(sheets){try{
  let na=0,ng=0;
  sheets.forEach(function(sh){const sn=sh[0],rows=sh[1];
   const hi=hdrRow(rows);if(hi<0)return;
   const H=rows[hi].map(x=>String(x||'').replace(/\s/g,''));
   const iN=H.findIndex(h=>h.indexOf('거래처명')>=0||h==='상호');
   const iA=H.findIndex(h=>h.indexOf('주소')>=0);
   const iT=H.findIndex(h=>h.indexOf('전화')>=0);
   if(iN<0)return;
   const isRoute=!/원장|ERP|실패|Sheet/i.test(sn);
   rows.slice(hi+1).forEach(function(r){const n=String(r[iN]||'').trim();if(!n)return;
    if(iA>=0&&r[iA]){const a=String(r[iA]).replace(/\s+/g,' ').trim();if(a&&!ADDR[n]){ADDR[n]=a;na++}}
    if(iT>=0&&r[iT])TEL[n]=String(r[iT]).trim();
    if(isRoute){GRP[n]=sn;ng++}})});
  if(!na&&!ng)return alert('읽지 못했습니다.\n"거래처명"과 "주소" 컬럼이 있는 파일인지 확인해주세요.');
  ORDERS.forEach(function(o){if(!LEARN[o.n]&&(ASSIGN[o.i]==='_'||ASSIGN[o.i]===undefined)){
   const g=guess(o);if(g!=='_')ASSIGN[o.i]=g}});
  save();render();toast('주소 '+na+'건 · 동선분류 '+ng+'건 등록');
 }catch(e){alert('오류: '+e.message)}})}
function onOrders(f){if(!f)return;
 readSheets(f,function(sheets){try{
  const rows=sheets[0][1];
  const hi=hdrRow(rows);
  if(hi<0)return alert('헤더를 찾지 못했습니다.\n"거래처명" 컬럼이 있는 명세서인지 확인해주세요.');
  const H=rows[hi].map(x=>String(x||'').replace(/\s/g,''));
  const ix=function(n){return H.findIndex(h=>h.indexOf(n)>=0)};
  const iN=ix('거래처명'),iP=ix('품목명'),iS=ix('비고'),iM=ix('적요'),iQ=ix('수량'),iD=ix('거래일자');
  if(iN<0||iP<0||iQ<0)return alert('거래처명 / 품목명·규격 / 수량 컬럼이 필요합니다.');
  const NEW=[],cs={};let cn=0;
  rows.slice(hi+1).forEach(function(r){
   const n=String(r[iN]||'').trim(),p=String(r[iP]||'').trim();
   if(!n||!p||/단가정정/.test(p))return;
   const q=Math.round(parseFloat(r[iQ])||0);if(q<=0)return;
   if(/택배비|운임비/.test(p)){FEE[n]=1;return}
   let dd='';const dv=r[iD];
   if(dv instanceof Date)dd=new Date(dv.getTime()-dv.getTimezoneOffset()*60000).toISOString().slice(0,10);
   else{const mm=String(dv||'').match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
    if(mm)dd=mm[1]+'-'+('0'+mm[2]).slice(-2)+'-'+('0'+mm[3]).slice(-2)}
   if(!cs[n]){cs[n]=1;cn++}
   NEW.push({n:n,p:p,s:String(r[iS]||'').trim(),q:q,m:String(r[iM]||'').trim().slice(0,80),d:dd})});
  if(!NEW.length)return alert('읽을 수 있는 주문이 없습니다.');
  const nd=[];NEW.forEach(function(l){if(nd.indexOf(l.d)<0)nd.push(l.d)});
  if(!confirm('거래처 '+cn+'곳 · '+nd.join(', ')+'\n불러올까요? 같은 날짜 자료는 교체됩니다.'))return;
  RAW=RAW.filter(l=>nd.indexOf(l.d)<0).concat(NEW);RAWV=Date.now();
  if(nd.length===1)SEL=nd[0];
  ASSIGN=null;ST={};build(true);save();render();
  toast(cn+'곳 불러옴 — 자동배정 완료 ✨');
 }catch(e){alert('오류: '+e.message)}})}

document.getElementById('capB').innerHTML=CAP_DEF.map(function(c){
 return '<tr><td><b>'+c.l+'</b></td>'
 +'<td style="color:#8b9aab;font-size:11px">'+(c.k.join(', ')||'그 외 전부')+'</td>'

 +'oninput="CAPS[\''+c.id+'\']=+this.value||1;save();render()"></td></tr>'}).join('');
render();
syncInit();
loadWx();
