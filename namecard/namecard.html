<html lang="ko"><head><meta charset="utf-8">
<title>박상민 팀장 명함</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1c3f;--navy2:#14407f;--orange:#f28c28;--ink:#0a1c3f}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:91mm 54mm;margin:0}
html,body{background:#e9edf2;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{padding:24px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
.card{position:relative;width:91mm;height:54mm;overflow:hidden;background:#fff;flex:none;box-shadow:0 6px 24px rgba(10,28,63,.25)}
.card *{position:relative}
/* ---------- 앞면 ---------- */
.accent{position:absolute;left:0;top:0;width:61.4mm;height:54mm;background:var(--orange);clip-path:polygon(0 0,100% 0,86.2% 100%,0 100%)}
.navy{position:absolute;left:0;top:0;width:60mm;height:54mm;background:linear-gradient(135deg,var(--navy) 0%,#102f63 60%,var(--navy2) 100%);clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
.navy:after{content:"";position:absolute;right:-18mm;top:-14mm;width:46mm;height:46mm;border-radius:50%;border:.35mm solid rgba(255,255,255,.07)}
.role{position:absolute;left:6mm;top:6.2mm;font-size:6.4pt;font-weight:700;color:var(--orange);letter-spacing:.32em}
.name{position:absolute;left:5.8mm;top:9.4mm;font-size:21pt;font-weight:900;color:#fff;letter-spacing:.3em;line-height:1}
.rule{position:absolute;left:6mm;top:19.6mm;width:9mm;height:.55mm;background:var(--orange)}
.info{position:absolute;left:6mm;top:23mm;width:46mm;color:#fff}
.row{display:flex;gap:2mm;align-items:flex-start;margin-bottom:1.35mm;line-height:1.28}
.row .k{flex:none;width:6.6mm;font-size:5.2pt;font-weight:700;color:var(--orange);letter-spacing:.06em;padding-top:.35mm}
.row .v{font-size:6.5pt;font-weight:400;color:#f3f6fb}
.row.m .v{font-weight:700;font-size:7.4pt;color:#fff}
.right{position:absolute;left:57mm;top:0;width:34mm;height:54mm}
.logo1{position:absolute;left:7mm;top:8.6mm;width:24mm}
.logo2{position:absolute;left:5.6mm;top:21.4mm;width:26.4mm}
.sep{position:absolute;left:7mm;top:19mm;width:24mm;height:.25mm;background:#d6dde8}
.urls{position:absolute;left:6.4mm;top:40.8mm;display:flex;flex-direction:column;gap:1.5mm}
.url{font-size:5.9pt;font-weight:700;color:var(--navy);letter-spacing:.1em;display:flex;align-items:center;gap:1.4mm;white-space:nowrap}
.url i{display:block;width:1.5mm;height:1.5mm;border-radius:50%;background:var(--orange);flex:none}
.url i.kw{background:#1457c8}
/* ---------- 뒷면 ---------- */
.back{background:linear-gradient(135deg,var(--navy) 0%,#102f63 55%,var(--navy2) 100%)}
.back .c1{position:absolute;right:-16mm;top:-20mm;width:60mm;height:60mm;border-radius:50%;background:rgba(242,140,40,.10)}
.back .c2{position:absolute;left:-14mm;bottom:-22mm;width:50mm;height:50mm;border-radius:50%;border:.4mm solid rgba(255,255,255,.08)}
.b-title{position:absolute;left:0;right:0;top:5.2mm;text-align:center;font-size:17pt;font-weight:900;color:#fff;letter-spacing:.12em}
.b-title b{color:var(--orange);font-weight:900;margin:0 .1em}
.b-rule{position:absolute;left:39.5mm;top:14.2mm;width:12mm;height:.55mm;background:var(--orange)}
.b-sub{position:absolute;left:0;right:0;top:16mm;text-align:center;font-size:4.6pt;font-weight:500;color:#aebfdc;letter-spacing:.3em}
.plate{position:absolute;left:10.5mm;width:70mm;background:#fff;border-radius:1.8mm;box-shadow:0 1mm 3mm rgba(0,0,0,.25)}
.p1{top:21.5mm;height:12mm}
.p1 img{position:absolute;top:50%;transform:translateY(-50%)}
.p1 .a{left:5mm;width:25mm}
.p1 .d{position:absolute;left:35mm;top:2.6mm;width:.25mm;height:6.8mm;background:#cfd7e3}
.p1 .b{left:39mm;width:27mm}
.p2{top:36.3mm;height:10.6mm}
.p2 img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:63mm}
.b-url{position:absolute;left:0;right:0;top:48.6mm;text-align:center;font-size:5.4pt;font-weight:500;color:#cdd8ee;letter-spacing:.2em}
@media screen and (max-width:420px){body{padding:12px}}
@media print{body{padding:0;background:#fff;display:block}.card{box-shadow:none;page-break-after:always}}
